<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spesa">
<meta name="theme-color" content="#fbfaf5">
<title>Spesa</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbfaf5;--grid:#d3e3ef;--ink:#1d2a4d;--soft:#8b93a7;--es:#1f5fbf;--li:#f7c600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px -apple-system,system-ui,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
header{padding:calc(env(safe-area-inset-top) + 14px) 20px 10px;background:var(--paper)}
h1{margin:0;font:700 34px/1.1 -apple-system,system-ui,sans-serif;letter-spacing:-.02em}
#date{color:var(--soft);font-size:14px;text-transform:capitalize;cursor:pointer}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background-color:var(--paper);background-attachment:local;background-size:100% 100%,28px 28px,28px 28px;
background-image:linear-gradient(90deg,transparent 47px,rgba(229,72,77,.35) 47px,rgba(229,72,77,.35) 48px,transparent 48px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
.row{display:flex;align-items:center;min-height:56px;padding:0 6px 0 10px;gap:8px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:none;color:transparent;font:600 20px/1 Caveat,cursive;display:grid;place-items:center;flex:none;padding:0;transition:background .3s,color .3s}
.done .chk{background:var(--ink);color:#fff}
.t{flex:1;padding-left:10px;font:500 29px/28px Caveat,'Bradley Hand',cursive;word-break:break-word}
.w{display:inline-block;background:linear-gradient(var(--ink),var(--ink)) no-repeat 0 58%/0% 2.5px;transition:background-size .45s,color .45s}
.done .w{background-size:100% 2.5px;color:var(--soft)}
.pen{animation:pen var(--d) steps(var(--n),end) backwards}
@keyframes pen{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.sq{width:22px;height:22px;border-radius:6px;border:2px solid var(--soft);background:transparent;flex:none;padding:0}
.s1{background:var(--es);border-color:var(--es)}.s2{background:var(--li);border-color:var(--li)}
.del{background:none;border:0;color:var(--soft);font-size:18px;width:34px;height:44px;flex:none;padding:0}
.empty{padding:20px 60px;color:var(--soft);font:500 27px/28px Caveat,cursive;margin:0}
#add{display:flex;gap:8px;padding:8px 12px;background:var(--paper)}
#in{flex:1;font:17px -apple-system,system-ui,sans-serif;padding:12px 16px;border:1px solid #0002;border-radius:14px;background:#fff;color:var(--ink);min-width:0}
.plus{width:46px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:26px;padding:0}
nav{display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);background:rgba(251,250,245,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid #0001}
nav button{flex:1;background:none;border:0;font:600 11px -apple-system,system-ui,sans-serif;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px}
nav button.on{color:var(--ink)}
nav i{width:24px;height:24px;border-radius:7px;border:2px solid currentColor;display:block}
nav [data-v=lista] i{background:repeating-linear-gradient(currentColor 0 2px,transparent 2px 6px) content-box;padding:3px}
nav [data-v=eurospin] i{background:var(--es);border-color:var(--es)}
nav [data-v=lidl] i{background:var(--li);border-color:var(--li)}
.card{margin:14px 16px;padding:16px;background:#fff;border-radius:18px;box-shadow:0 2px 14px #0001;text-align:center}
.card h2{margin:0 0 12px;font-size:17px}
.card img{width:100%;border-radius:12px;margin-top:12px}
.bc{background:#fff;padding:4px}.bc svg{display:block;margin:0 auto;max-width:100%}.bc.qr svg{width:240px;height:auto}
.num{font:600 15px ui-monospace,monospace;letter-spacing:.08em;margin-top:6px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;padding:12px;border:0;border-radius:12px;background:#1d2a4d12;font:600 15px -apple-system,system-ui,sans-serif;color:var(--ink)}
.btns button:last-child{background:var(--ink);color:#fff}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:9}
.sh{background:#fff;width:100%;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:12px}
.sh h3{margin:0;font-size:20px}
.sh label{font-size:13px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.sh input,.sh select{font:16px -apple-system,system-ui,sans-serif;padding:10px;border:1px solid #0002;border-radius:10px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.pen{animation:none}.w{transition:none}}
</style>
</head>
<body>
<header><h1>Spesa</h1><div id="date"></div></header>
<main id="main"></main>
<form id="add"><input id="in" placeholder="Scrivi: pane, pasta, latte…" enterkeyhint="done" autocomplete="off" autocapitalize="sentences"><button class="plus" aria-label="Aggiungi">+</button></form>
<nav>
<button data-v="lista" class="on"><i></i>Lista</button>
<button data-v="eurospin"><i></i>Eurospin</button>
<button data-v="lidl"><i></i>Lidl</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,collection,doc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 1) Incolla qui la configurazione del tuo progetto Firebase
const CONFIG={apiKey:"AIzaSyBo1ZcfkIGYNYcv-FnDimGo_0e1xKGQMJw",authDomain:"spesa-f38ae.firebaseapp.com",projectId:"spesa-f38ae",appId:"1:325660434580:web:0840f5fd839e7850709481"};

const $=s=>document.querySelector(s), main=$('#main');
const ST=['','eurospin','lidl'], NAMES=['','Eurospin','Lidl'];
const clean=s=>(s||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let code=clean(localStorage.code), view='lista', items=[], cards={}, fresh=new Map(), first=true, hold=0, db, col;

// ---------- divisione delle voci ----------
const ADJ=new Set('fresco fresca freschi fresche intero intera scremato parzialmente integrale integrali bio biologico biologica zero senza lattosio light grande grandi piccolo piccoli'.split(' '));
const CONN=new Set('di del della dello dei delle al alla alle ai con da per in senza'.split(' '));
const COMP=new Set(['carta igienica','carta cucina','olio extravergine','pasta sfoglia','sale grosso','detersivo piatti','sacchetti spazzatura']);
const QTY=/^\d+([.,]\d+)?(x|kg|g|gr|l|ml|cl)?$/i;
function parse(txt){
  const out=[];
  txt.split(/[,;\n+\/|&–—-]+|\s+e\s+/i).forEach(ch=>{
    const L=[];
    ch.trim().split(/\s+/).filter(Boolean).forEach(w=>{
      const lw=w.toLowerCase().replace(/’/g,"'"), l=L[L.length-1];
      if(QTY.test(w)) L.push({t:w,open:true});
      else if(l&&l.open){l.t+=' '+w;l.open=CONN.has(lw);}
      else if(l&&(CONN.has(lw)||ADJ.has(lw)||/^(d|dell|all|nell)'/.test(lw))){l.t+=' '+w;l.open=CONN.has(lw);}
      else if(l&&COMP.has((l.t+' '+w).toLowerCase())){l.t+=' '+w;}
      else L.push({t:w,open:false});
    });
    L.forEach(x=>out.push(x.t.charAt(0).toUpperCase()+x.t.slice(1)));
  });
  return out;
}

// ---------- avvio ----------
function start(){
  $('#date').onclick=()=>{const n=clean(prompt('Codice della lista (uguale su entrambi i telefoni):',code));if(n){localStorage.code=n;location.reload();}};
  if(!CONFIG.projectId){main.innerHTML='<p class="empty">Manca la configurazione Firebase: aprila nel file index.html.</p>';return;}
  if(!code){code=clean(prompt('Scegli un codice per la vostra lista. Scrivi lo stesso codice su entrambi i telefoni (lungo e difficile da indovinare):'));
    if(!code){main.innerHTML='<p class="empty">Tocca la data in alto per impostare il codice.</p>';return;} localStorage.code=code;}
  const app=initializeApp(CONFIG);
  db=initializeFirestore(app,{localCache:persistentLocalCache()});
  col=collection(db,'liste',code,'voci');
  onSnapshot(col,s=>{
    if(!s.metadata.fromCache){ if(!first) s.docChanges().forEach(c=>{if(c.type==='added')fresh.set(c.doc.id,Date.now());}); first=false; }
    items=s.docs.map(d=>({id:d.id,...d.data()}));
    sweep(); render();
  });
  onSnapshot(collection(db,'liste',code,'tessere'),s=>{cards={};s.docs.forEach(d=>cards[d.id]=d.data());render();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){sweep();render();}});
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// le voci spuntate ieri (o prima) vengono eliminate
function sweep(){
  const t0=new Date().setHours(0,0,0,0);
  items.filter(i=>i.d&&i.d<t0).forEach(i=>deleteDoc(doc(col,i.id)));
  items=items.filter(i=>!(i.d&&i.d<t0));
}

// ---------- disegno ----------
const rowHtml=i=>{
  const e=fresh.get(i.id), el=e?(Date.now()-e)/1000:99, dur=Math.min(.3+i.t.length*.07,2);
  const pen=el<dur?` pen" style="--d:${dur}s;--n:${i.t.length};animation-delay:${-el}s`:'';
  return `<div class="row${i.d?' done':''}" data-id="${i.id}"><button class="chk" aria-label="Fatto">✓</button><div class="t"><span class="w${pen}">${esc(i.t)}</span></div><button class="sq s${i.s||0}" aria-label="Negozio"></button><button class="del" aria-label="Cancella">✕</button></div>`;
};
function cardHtml(v){
  const c=cards[v]||{}, n=NAMES[ST.indexOf(v)];
  let b='';
  if(c.num) b+=`<div class="bc${c.f==='QR'?' qr':''}" id="bc" data-f="${c.f||'CODE128'}" data-n="${esc(c.num)}"></div><div class="num">${esc(c.num)}</div>`;
  if(c.img) b+=`<img src="${c.img}" alt="Tessera ${n}">`;
  if(!b) b='<p class="empty" style="padding:0 0 4px">Nessuna tessera salvata.</p>';
  return `<section class="card"><h2>${n}</h2>${b}<div class="btns">${c.link?'<button data-a="open">Apri l’app</button>':''}<button data-a="edit">${c.num||c.img?'Modifica':'Aggiungi tessera'}</button></div></section>`;
}
function drawCode(){
  const el=$('#bc'); if(!el)return;
  const n=el.dataset.n,f=el.dataset.f;
  try{
    if(f==='QR'){const q=qrcode(0,'M');q.addData(n);q.make();el.innerHTML=q.createSvgTag({scalable:true,margin:0});}
    else{el.innerHTML='<svg></svg>';const s=el.firstChild;JsBarcode(s,n,{format:f,width:3,height:110,displayValue:false,margin:0});
      s.setAttribute('viewBox',`0 0 ${parseFloat(s.getAttribute('width'))} ${parseFloat(s.getAttribute('height'))}`);s.removeAttribute('width');s.removeAttribute('height');s.style.cssText='width:100%;height:auto';}
  }catch(e){el.textContent='Il numero non è valido per questo tipo di codice.';}
}
function render(){
  if(Date.now()<hold){setTimeout(render,hold-Date.now()+20);return;}
  $('#date').textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const si=ST.indexOf(view);
  const list=items.filter(i=>si<1||i.s===si).sort((a,b)=>(!!a.d-!!b.d)||((a.d||a.c)-(b.d||b.c)));
  main.innerHTML=(si>0?cardHtml(view):'')+(list.map(rowHtml).join('')||(si>0?'':'<p class="empty">La lista è vuota. Scrivi qualcosa qui sotto.</p>'));
  drawCode();
}

// ---------- azioni ----------
const ref=id=>doc(col,id);
main.onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  const row=b.closest('.row'), id=row&&row.dataset.id, it=id&&items.find(x=>x.id===id);
  if(b.classList.contains('chk')){hold=Date.now()+700;row.classList.toggle('done');updateDoc(ref(id),{d:it.d?null:Date.now()});setTimeout(render,720);}
  else if(b.classList.contains('del')){deleteDoc(ref(id));}
  else if(b.classList.contains('sq')){updateDoc(ref(id),{s:((it.s||0)+1)%3});}
  else if(b.dataset.a==='open'){location.href=cards[view].link;}
  else if(b.dataset.a==='edit'){sheet(view);}
};
$('#add').onsubmit=e=>{
  e.preventDefault(); if(!col)return;
  const s=Math.max(0,ST.indexOf(view));
  parse($('#in').value).forEach((t,k)=>{const r=doc(col);fresh.set(r.id,Date.now()+k*350);setDoc(r,{t,s,c:Date.now()+k,d:null});});
  $('#in').value='';
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();main.scrollTop=0;});

const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7));};i.src=URL.createObjectURL(f);});
function sheet(v){
  const c=cards[v]||{}, o=document.createElement('div'); o.className='ov';
  o.innerHTML=`<form class="sh"><h3>Tessera ${NAMES[ST.indexOf(v)]}</h3>
  <label>Numero della tessera<input name="num" inputmode="numeric" value="${esc(c.num||'')}"></label>
  <label>Tipo di codice<select name="f"><option value="CODE128">Barre (Code 128)</option><option value="EAN13">Barre (EAN‑13)</option><option value="QR">QR code</option></select></label>
  <label>Foto della tessera<input type="file" name="img" accept="image/*"></label>
  <label>Link dell’app del negozio (facoltativo)<input name="link" type="url" placeholder="https://…" value="${esc(c.link||'')}"></label>
  <div class="btns"><button type="button" data-x>Annulla</button><button>Salva</button></div></form>`;
  document.body.appendChild(o);
  const f=o.querySelector('form'); f.f.value=c.f||'CODE128';
  o.querySelector('[data-x]').onclick=()=>o.remove();
  f.onsubmit=async e=>{
    e.preventDefault();
    const file=f.img.files[0], img=file?await shrink(file):(c.img||'');
    setDoc(doc(db,'liste',code,'tessere',v),{num:f.num.value.trim(),f:f.f.value,link:f.link.value.trim(),img});
    o.remove();
  };
}
start();
</script>
</body>
</html>
